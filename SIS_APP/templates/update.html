{% extends "base.html" %}

{% block title %}Update Student - Student Information System{% endblock %}

{% block content %}
    <section class="form-container">
        {% if student %}
            <div class="confirmation-header">
                <h3>✏️ Update Student Information</h3>
                <p>Edit the details below and save the changes.</p>
            </div>

            <form class="registration-form" method="POST" action="{{ url_for('update_student_route', student_id=student.id) }}">
                <div class="form-group">
                    <label for="student_name">Student Name:</label>
                    <input type="text" id="student_name" name="student_name" value="{{ student.student_name }}" required>
                </div>

                <div class="form-group">
                    <label for="registration_number">Registration Number:</label>
                    <input type="text" id="registration_number" name="registration_number" value="{{ student.registration_number }}" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" value="{{ student.email }}" required>
                </div>

                <div class="form-group">
                    <label for="programme">Programme:</label>
                    <input type="text" id="programme" name="programme" value="{{ student.programme }}" required>
                </div>

                <div class="confirmation-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('students_list') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        {% else %}
            <div class="confirmation-card">
                <p>Student not found.</p>
                <a href="{{ url_for('students_list') }}" class="btn btn-primary">Back to Students</a>
            </div>
        {% endif %}
    </section>
{% endblock %}
